[package]
name = "NiNi3"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
anyhow = "1.0"
dotenvy = "0.15"
ratatui = "0.29"
crossterm = "0.28"
arboard = "3.4"
pulldown-cmark = "0.9"
toml = "0.8"

